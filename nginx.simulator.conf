server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/emu;
    location /upstream-source/ { alias /usr/share/nginx/html/upstream-source/; }
    location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
}
